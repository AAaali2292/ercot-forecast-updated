name: ERCOT daily forecast

# ---------------------------------------------------------------------------
# Schedule (GitHub cron is UTC and ignores daylight saving; ERCOT runs on CT)
#
#   11:07 UTC  daily     06:07 CDT / 05:07 CST  score, forecast tomorrow, publish
#   12:37 UTC  backup    07:37 CDT / 06:37 CST  forecast only if the 11:07 run missed
#                                               (both well before the 10:00 CT close)
#   19:53 UTC  dam       14:53 CDT / 13:53 CST  fetch tomorrow's cleared DAM, score
#   22:23 UTC  dam       17:23 CDT / 16:23 CST  backstop if ERCOT published late
#   04:47, 05:47, 06:47 UTC  capture            real-time prices around CT midnight
#                                               (three windows cover both DST regimes)
#   Sunday 09:17 UTC  weekly                    refresh annual DAM file + backtest
#
# Odd minutes on purpose: GitHub delays jobs queued on the hour.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "7 11 * * *"
    - cron: "37 12 * * *"
    - cron: "53 19 * * *"
    - cron: "23 22 * * *"
    - cron: "47 4 * * *"
    - cron: "47 5 * * *"
    - cron: "47 6 * * *"
    - cron: "17 9 * * 0"
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        required: true
        default: "status"
        type: choice
        options: [status, backfill, daily, forecast, dam, capture, publish, backtest, weekly]

permissions:
  contents: write

concurrency:
  group: ercot-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide command
        id: pick
        run: |
          S="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
          elif [ "$S" = "7 11 * * *" ]; then CMD="daily"
          elif [ "$S" = "37 12 * * *" ]; then CMD="backup"
          elif [ "$S" = "53 19 * * *" ] || [ "$S" = "23 22 * * *" ]; then CMD="dam"
          elif [ "$S" = "17 9 * * 0" ]; then CMD="weekly"
          else CMD="capture"
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "running: $CMD"

      - name: Run
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ steps.pick.outputs.cmd }}" in
            backup)  python -m src.run forecast --if-missing ;;
            weekly)  python -m src.run backfill && python -m src.run backtest --days 60 ;;
            *)       python -m src.run ${{ steps.pick.outputs.cmd }} ;;
          esac

      # Commit whatever was produced, even if a step above failed, so a partial run
      # (e.g. capture worked, forecast failed) still keeps its evidence.
      - name: Commit results
        if: always()
        run: |
          git config user.name  "ercot-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          MSG="${{ steps.pick.outputs.cmd }}: $(date -u +'%Y-%m-%d %H:%M UTC') run ${{ github.run_id }}"
          git commit -q -m "$MSG"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}"; then
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              set +e   # from here a failure must loop, not abort and lose this run's outputs
              # Another run pushed overlapping files. Never leave a half-done rebase:
              # save this run's outputs, take main as it is, and re-apply them with the
              # same integrity rules (an existing live forecast is never replaced).
              git rebase --abort || true
              SAVE=$(mktemp -d)
              cp -r forecasts outcomes notes backtest "$SAVE"/ 2>/dev/null || true
              cp data/dam_history.csv "$SAVE"/ 2>/dev/null || true
              git fetch -q origin "${GITHUB_REF_NAME}"
              git reset -q --hard "origin/${GITHUB_REF_NAME}"
              python -m src.run merge --src "$SAVE"
              git add -A
              git diff --staged --quiet || git commit -q -m "$MSG (merged)"
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            sleep $((i * 7))
          done
          echo "push failed after retries" && exit 1

      # Last resort: if the push never succeeded, keep this run's outputs downloadable.
      - name: Keep outputs if push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ercot-outputs-${{ github.run_id }}
          path: |
            forecasts/
            outcomes/
            notes/
            data/
            backtest/
          retention-days: 30
