name: Model v2 experiment

# Manual only. Runs the SIMULATED v1-vs-v2 comparison (src/experiment.py) and commits
# its results to backtest/v2_compare/. It never touches forecasts/, outcomes/ or the
# production model, so it cannot affect the live record.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot-experiment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run experiment
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m src.experiment

      - name: Commit results
        if: always()
        run: |
          git config user.name  "ercot-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/v2_compare 2>/dev/null || true
          git add data/dam_archive_hub.csv 2>/dev/null || true
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "experiment: v2 comparison $(date -u +'%Y-%m-%d %H:%M UTC') run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 7))
          done
          echo "push failed after retries" && exit 1

      - name: Keep results if push failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: v2-compare-${{ github.run_id }}
          path: |
            backtest/v2_compare/
            data/dam_archive_hub.csv
          retention-days: 30
